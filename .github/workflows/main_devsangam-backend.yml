name: Deploy DevSangam API to Azure

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/main_devsangam-backend.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint API
        run: npm run lint -w @devsangam/api

      - name: Typecheck API
        run: npm run typecheck -w @devsangam/api

      - name: Build API
        run: npm run build -w @devsangam/api

      - name: Prepare deployment package
        run: |
          mkdir deployment
          cp package.json deployment/
          cp package-lock.json deployment/
          cp -R node_modules deployment/

          mkdir -p deployment/apps/api
          cp apps/api/package.json deployment/apps/api/
          cp -R apps/api/dist deployment/apps/api/

          mkdir -p deployment/packages/types
          cp packages/types/package.json deployment/packages/types/
          cp -R packages/types/src deployment/packages/types/

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: devsangam-api
          path: deployment/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: devsangam-api
          path: deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FBA0FD4BB9D047468983B5728CBB94CD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_E1FB23579FAD498C9EADB0CEB6821ACE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C9C9AD23AF7E49FD98864E825F6A2441 }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: devsangam-backend
          slot-name: Production
          package: deployment
